[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-cfg-wizard"
version = "0.2.0"
description = "Reusable YAML config resolution, merge, and validation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]
django = ["Django>=4.2"]

[project.scripts]
yaml-cfg = "yaml_cfg_wizard.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["yaml_cfg_wizard*"]

[tool.stackctl]
# Minimal config - this is a library repo
config_loader = "yaml_cfg_wizard:load_config"
config_key = "stack"
