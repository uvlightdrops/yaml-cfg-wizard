[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-cfg-wizard"
version = "0.1.0"
description = "Reusable YAML config resolution, merge, and validation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.scripts]
yaml-cfg = "yaml_cfg_wizard.cli:app"

[project.optional-dependencies]
cli = [
  "typer>=0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["yaml_cfg_wizard*"]
